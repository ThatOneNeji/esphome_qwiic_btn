# CI fixture: mirrors ../../example.esp-idf.yaml but points external_components at the local
# checkout instead of GitHub, so CI validates the component as committed rather than the last
# published ref. Keep in sync with ../../example.esp-idf.yaml (besides `external_components:`).
esphome:
  name: qwiic-btn-esp-idf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: ../../components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

i2c:
  - id: i2c_bus
    sda: GPIO21
    scl: GPIO22
    frequency: 400kHz
    scan: true

qwiic_btn:
  id: my_button
  i2c_id: i2c_bus
  address: 0x6F
  debounce_time: 20ms
  default_led_brightness: 25%

binary_sensor:
  - platform: qwiic_btn
    qwiic_btn_id: my_button
    name: "Qwiic Button"

output:
  - platform: qwiic_btn
    id: qwiic_btn_led
    qwiic_btn_id: my_button

light:
  - platform: monochromatic
    name: "Qwiic Button LED"
    output: qwiic_btn_led
