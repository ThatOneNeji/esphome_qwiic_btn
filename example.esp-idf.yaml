esphome:
  name: qwiic-btn-esp-idf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  source:
    type: git
    url: https://github.com/ThatOneNeji/esphome_qwiic_btn
    ref: main

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

i2c:
  - id: i2c_bus
    sda: GPIO21
    scl: GPIO22
    frequency: 400kHz
    scan: true

qwiic_btn:
  id: my_button
  i2c_id: i2c_bus
  address: 0x6F
  debounce_time: 20ms
  default_led_brightness: 25%

binary_sensor:
  - platform: qwiic_btn
    qwiic_btn_id: my_button
    name: "Qwiic Button"

output:
  - platform: qwiic_btn
    id: qwiic_btn_led
    qwiic_btn_id: my_button

light:
  - platform: monochromatic
    name: "Qwiic Button LED"
    output: qwiic_btn_led
